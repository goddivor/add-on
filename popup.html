<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grubhub Cart Saver</title>
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }

    .status {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .status.no-cart {
      background: #f8f9fa;
      color: #666;
    }

    .status.has-cart {
      background: #d4edda;
      color: #155724;
    }

    .cart-info {
      font-size: 13px;
      line-height: 1.6;
    }

    .cart-info strong {
      color: #333;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: #007bff;
      color: white;
    }

    .btn-primary:hover {
      background: #0056b3;
    }

    .btn-danger {
      background: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    .footer {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>💾 Grubhub Cart Saver</h1>

  <div id="status" class="status no-cart">
    <div id="statusMessage">No saved cart</div>
    <div id="cartInfo" class="cart-info hidden"></div>
  </div>

  <div class="actions">
    <button id="viewCart" class="btn-primary hidden">
      📋 View saved cart
    </button>
    <button id="clearCart" class="btn-danger hidden">
      🗑️ Delete cart
    </button>
    <button id="openGrubhub" class="btn-secondary">
      🍔 Open Grubhub
    </button>
  </div>

  <div class="footer">
    v1.0.0 - Extension to save your cart
  </div>

  <script src="popup.js"></script>
</body>
</html>
